<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="362" viewBox="0 0 1100 362"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#327a91"/></marker></defs><rect width="1100" height="362" rx="16" fill="#eff4fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="45" font-size="26" font-weight="bold" fill="#27364b">OPEN MATERIAL LINKER</text><rect x="28" y="70" width="600" height="220" rx="12" fill="#fff" stroke="#c6d3e2"/><text x="48" y="105" font-size="22" font-weight="bold" fill="#27364b">1. Keep the complete folder</text><text x="48" y="145" font-size="21" font-weight="bold" fill="#27364b">Maya_MaterialLinker/</text><text x="76" y="182" font-size="19" font-weight="normal" fill="#27364b">open_material_linker.py</text><text x="76" y="218" font-size="19" font-weight="normal" fill="#27364b">scripts / material_linker /</text><text x="76" y="254" font-size="19" font-weight="normal" fill="#27364b">material_link_map.json  (optional preset)</text><rect x="670" y="70" width="402" height="220" rx="12" fill="#dcebf4" stroke="#c6d3e2"/><text x="692" y="105" font-size="22" font-weight="bold" fill="#27364b">2. Drag the .py file</text><text x="692" y="140" font-size="21" font-weight="normal" fill="#27364b">into the Maya viewport</text><text x="692" y="200" font-size="21" font-weight="bold" fill="#27364b">The window opens.</text><text x="692" y="241" font-size="18" font-weight="normal" fill="#27364b">Browse → Preview → Connect</text><path d="M545 174 H607.5 V174 H670" fill="none" stroke="#327a91" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="332" font-size="18" font-weight="normal" fill="#27364b">No copying scripts into the Maya project or editing JSON for normal use.</text></g></svg>