<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17344b}.title{font-size:30px;font-weight:700}.sub{font-size:20px;font-weight:600}.code{font-family:Consolas,monospace;font-size:19px}.hint{font-size:18px;fill:#3e5d72}.small{font-size:16px;fill:#3e5d72}</style>
<text x="40" y="48" class="title">Material Linker — prepare your Maya project</text>
<text x="40" y="79" class="hint">Copy the script folder and JSON config. Your textures stay in sourceimages.</text>
<rect x="35" y="110" width="440" height="330" rx="12" fill="white" stroke="#b9cddc"/>
<text x="58" y="149" class="sub">1. Downloaded tool</text>
<text x="58" y="185" class="code">Maya_MaterialLinker/</text>
<rect x="55" y="203" width="399" height="79" rx="7" fill="#e1f0ff"/>
<text x="73" y="232" class="code">scripts/</text><text x="100" y="263" class="code">material_linker/</text>
<rect x="55" y="294" width="399" height="46" rx="7" fill="#e4f6e8"/>
<text x="73" y="324" class="code">material_link_map.json</text>
<text x="73" y="375" class="code">examples/load_in_maya.py</text>
<text x="73" y="407" class="small">Open this example later in the Script Editor.</text>
<rect x="565" y="110" width="500" height="330" rx="12" fill="white" stroke="#b9cddc"/>
<text x="588" y="149" class="sub">2. Your Maya project</text>
<text x="588" y="185" class="code">MatLink_Demo/</text>
<rect x="585" y="203" width="457" height="79" rx="7" fill="#e1f0ff"/>
<text x="603" y="232" class="code">scripts/</text><text x="630" y="263" class="code">material_linker/</text>
<rect x="585" y="294" width="457" height="46" rx="7" fill="#e4f6e8"/>
<text x="603" y="324" class="code">material_link_map.json</text>
<text x="603" y="375" class="code">sourceimages/</text><text x="603" y="408" class="code">scenes/</text>
<path d="M480 243 H552 M540 233 L554 243 L540 253" fill="none" stroke="#2e8ecb" stroke-width="4"/>
<path d="M480 317 H552 M540 307 L554 317 L540 327" fill="none" stroke="#389760" stroke-width="4"/>
<rect x="35" y="460" width="1030" height="156" rx="12" fill="white" stroke="#b9cddc"/>
<text x="58" y="497" class="sub">3. Texture exports → sourceimages/</text>
<text x="58" y="533" class="code">Asset_Rusty2_M_Madera_Organico_BaseColor.tif</text>
<text x="58" y="564" class="code">Asset_Rusty2_M_Madera_Organico_Normal.tif</text>
<text x="58" y="596" class="small">Also export Roughness and Metalness. Match texture tokens to existing scene materials in the JSON.</text>
<text x="40" y="644" class="small">Folder-layout guide · MatLink_Demo is an example project name.</text>
